name: Fusion-RSS
version: "main"
slug: fusion
description: 轻量级的、自托管支持 Phone 友好型 RSS 聚合器和阅读器，全新 UI 界面
url: https://github.com/0x2E/fusion
arch:
  - amd64
  - aarch64
startup: application
init: false

# 镜像不带标签！version 字段就是标签
image: ghcr.io/0x2e/fusion

webui: "http://[HOST]:[PORT:4123]"

ports:
  8080/tcp: 4123
ports_description:
  8080/tcp: RSS Web 界面

volumes:
  - data:/data

ingress: true
ingress_port: 8080
ingress_entry: /

options:
  password: "fusion"

schema:
  password: str

environment:
  FUSION_PASSWORD: "fusion"
  FUSION_PORT: "8080"
  FUSION_DB_PATH: "/data/fusion.db"
  FUSION_TRUSTED_PROXIES: "0.0.0.0/0"
