# Fusion RSS - Home Assistant Add-on 配置
# 官方仓库: https://github.com/0x2E/fusion

name: Fusion-RSS
version: "main"
slug: fusion
description: 轻量级的、自托管支持 Phone 友好型 RSS 聚合器和阅读器，全新 UI 界面
url: https://github.com/0x2E/fusion
arch:
  - amd64
  - aarch64
startup: application
init: false

# 官方镜像 - main = 最新开发版，latest = 最新正式版
image: ghcr.io/0x2e/fusion:main

# Web UI（外部访问）
webui: "http://[HOST]:[PORT:4123]"

# 端口映射：外部 4123 → 内部 8080
ports:
  8080/tcp: 4123
ports_description:
  8080/tcp: RSS Web 界面

# 数据持久化
volumes:
  - data:/data

# Ingress 配置（HA 内部访问）
ingress: true
ingress_port: 8080
ingress_entry: /

# 默认配置
options:
  password: "fusion"

schema:
  password: str

# 环境变量
environment:
  FUSION_PASSWORD: "fusion"
  FUSION_PORT: "8080"
  FUSION_DB_PATH: "/data/fusion.db"
  FUSION_TRUSTED_PROXIES: "0.0.0.0/0"
